services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot
      POSTGRES_DB: docpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpilot"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://docpilot:docpilot@db:5432/docpilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./sample_docs:/app/sample_docs:ro
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build: .
    command: ["python", "-m", "app.mcp_server", "--http", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql://docpilot:docpilot@db:5432/docpilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
